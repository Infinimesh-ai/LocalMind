name: Release Desktop

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      app-version:
        required: true
        type: string
      git-short-hash:
        required: true
        type: string
      desktop_macos:
        description: 'Desktop - macOS'
        required: false
        default: true
        type: boolean
      desktop_windows:
        description: 'Desktop - Windows'
        required: false
        default: true
        type: boolean
      desktop_linux:
        description: 'Desktop - Linux'
        required: false
        default: true
        type: boolean
permissions:
  actions: write
  contents: write
  security-events: write
  id-token: write
  attestations: write

env:
  BUILD_TYPE: ${{ inputs.build-type }}
  RELEASE_VERSION: ${{ inputs.app-version }}
  DEBUG: 'affine:*,napi:*'
  MACOSX_DEPLOYMENT_TARGET: '11.6'

jobs:
  before-make:
    if: ${{ inputs.desktop_macos || inputs.desktop_windows || inputs.desktop_linux }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.build-type }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Setup @sentry/cli
        uses: ./.github/actions/setup-sentry
      - name: generate-assets
        run: yarn affine @affine/electron generate-assets
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.LOCALMIND_SENTRY_PROJECT || 'localmind-desktop' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ inputs.app-version }}
          RELEASE_VERSION: ${{ inputs.app-version }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static

  make-distribution-macos:
    if: ${{ inputs.desktop_macos }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - runner: macos-latest
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
          - runner: macos-latest
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
    needs: before-make
    uses: ./.github/workflows/release-desktop-platform.yml
    secrets: inherit
    with:
      build_type: ${{ inputs.build-type }}
      app_version: ${{ inputs.app-version }}
      git_short_hash: ${{ inputs.git-short-hash }}
      runner: ${{ matrix.spec.runner }}
      platform: ${{ matrix.spec.platform }}
      arch: ${{ matrix.spec.arch }}
      target: ${{ matrix.spec.target }}
      apple_codesign: true

  make-distribution-linux:
    if: ${{ inputs.desktop_linux }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
    needs: before-make
    uses: ./.github/workflows/release-desktop-platform.yml
    secrets: inherit
    with:
      build_type: ${{ inputs.build-type }}
      app_version: ${{ inputs.app-version }}
      git_short_hash: ${{ inputs.git-short-hash }}
      runner: ${{ matrix.spec.runner }}
      platform: ${{ matrix.spec.platform }}
      arch: ${{ matrix.spec.arch }}
      target: ${{ matrix.spec.target }}
      install_linux_deps: true

  build-windows:
    if: ${{ inputs.desktop_windows }}
    needs: before-make
    strategy:
      fail-fast: false
      matrix:
        spec:
          - platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
          - platform: win32
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    env:
      BUILD_TYPE: ${{ inputs.build-type }}
      DEBUG: 'affine:*,napi:*'
      RELEASE_VERSION: ${{ inputs.app-version }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.LOCALMIND_SENTRY_PROJECT || 'localmind-desktop' }}
      SENTRY_RELEASE: ${{ inputs.app-version }}
      SKIP_GENERATE_ASSETS: 1
      TS_RS_EXPERIMENT: this_is_unstable_software
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        timeout-minutes: 10
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/electron @affine/monorepo @affine/nbstore @toeverything/infra
          enableScripts: true
          hard-link-nm: false
          nmHoistingLimits: workspaces
        env:
          npm_config_arch: ${{ matrix.spec.arch }}

      - name: Build LocalMind native runtime
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.spec.target }}
          package: '@affine/native'

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static

      - name: Build Desktop Layers
        run: yarn affine @affine/electron build

      - name: Remove nbstore node_modules
        shell: bash
        run: |
          rm -rf packages/frontend/apps/electron/node_modules/@affine/nbstore/node_modules/@blocksuite/affine/node_modules
          rm -rf packages/frontend/apps/electron/node_modules/@affine/native/node_modules

      - name: Package windows app
        run: yarn affine @affine/electron package --platform=${{ matrix.spec.platform }} --arch=${{ matrix.spec.arch }}
        env:
          HOIST_NODE_MODULES: 1
          NODE_OPTIONS: --max-old-space-size=14384
          SKIP_WEB_BUILD: 1

      - name: Make squirrel.windows installer
        run: yarn affine @affine/electron make-squirrel --platform=${{ matrix.spec.platform }} --arch=${{ matrix.spec.arch }}

      - name: Make nsis.windows installer
        run: yarn affine @affine/electron make-nsis --platform=${{ matrix.spec.platform }} --arch=${{ matrix.spec.arch }}

      - name: Save artifacts
        run: |
          mkdir -p builds
          mv packages/frontend/apps/electron/out/*/make/zip/win32/${{ matrix.spec.arch }}/LocalMind*-win32-${{ matrix.spec.arch }}-*.zip ./builds/localmind-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.spec.arch }}.zip
          mv packages/frontend/apps/electron/out/*/make/squirrel.windows/${{ matrix.spec.arch }}/*.exe ./builds/localmind-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.spec.arch }}.exe
          mv packages/frontend/apps/electron/out/*/make/nsis.windows/${{ matrix.spec.arch }}/*.exe ./builds/localmind-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.spec.arch }}.nsis.exe

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./builds/localmind-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.spec.arch }}.zip
            ./builds/localmind-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.spec.arch }}.exe
            ./builds/localmind-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-windows-${{ matrix.spec.arch }}.nsis.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localmind-${{ matrix.spec.platform }}-${{ matrix.spec.arch }}-builds
          path: builds

  release:
    if: >-
      ${{
        always() &&
        (inputs.desktop_macos || inputs.desktop_linux || inputs.desktop_windows) &&
        needs.before-make.result == 'success' &&
        (!inputs.desktop_macos || needs.make-distribution-macos.result == 'success') &&
        (!inputs.desktop_linux || needs.make-distribution-linux.result == 'success') &&
        (!inputs.desktop_windows || needs.build-windows.result == 'success')
      }}
    needs:
      [
        before-make,
        make-distribution-macos,
        make-distribution-linux,
        build-windows,
      ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Download Artifacts (macos-x64)
        if: ${{ inputs.desktop_macos }}
        uses: actions/download-artifact@v4
        with:
          name: localmind-darwin-x64-builds
          path: ./release
      - name: Download Artifacts (macos-arm64)
        if: ${{ inputs.desktop_macos }}
        uses: actions/download-artifact@v4
        with:
          name: localmind-darwin-arm64-builds
          path: ./release
      - name: Download Artifacts (windows-x64)
        if: ${{ inputs.desktop_windows && needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: localmind-win32-x64-builds
          path: ./release
      - name: Download Artifacts (windows-arm64)
        if: ${{ inputs.desktop_windows && needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: localmind-win32-arm64-builds
          path: ./release
      - name: Download Artifacts (linux-x64)
        if: ${{ inputs.desktop_linux }}
        uses: actions/download-artifact@v4
        with:
          name: localmind-linux-x64-builds
          path: ./release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Copy Selfhost Release Files
        run: |
          cp ./.docker/selfhost/compose.yml ./release/docker-compose.yml
          cp ./.docker/selfhost/config.json.example ./release/config.json.example
          cp ./.docker/selfhost/schema.json ./release/config.schema.json
      - name: Generate Release yml
        run: |
          node ./scripts/generate-release-yml.mjs
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      - name: Generate signed release manifest
        run: node ./scripts/generate-release-manifest.mjs
        env:
          RELEASE_CHANNEL: ${{ inputs.build-type }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          LOCALMIND_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.LOCALMIND_RELEASE_PRIVATE_KEY_BASE64 }}
          LOCALMIND_RELEASE_PUBLIC_KEY_BASE64: ${{ vars.LOCALMIND_RELEASE_PUBLIC_KEY_BASE64 }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign release manifest with Sigstore
        run: cosign sign-blob --yes --bundle ./release/release-manifest.sigstore.json ./release/release-manifest.json
      - name: Attest release integrity metadata
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./release/SHA256SUMS
            ./release/release-manifest.json
            ./release/release-manifest.sig
            ./release/release-manifest.sigstore.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          draft: ${{ inputs.build-type == 'stable' }}
          prerelease: ${{ inputs.build-type != 'stable' }}
          tag_name: v${{ env.RELEASE_VERSION}}
          files: ./release/*
