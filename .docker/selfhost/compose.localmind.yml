name: affine-localmind
services:
  affine:
    image: ${LOCALMIND_AFFINE_IMAGE:-localmind-affine:local}
    build:
      context: ../..
      dockerfile: Dockerfile.localmind
    container_name: localmind_affine_server
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-3011}:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sparkclaw_adapter:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ${UPLOAD_LOCATION:-./data/localmind/storage}:/root/.affine/storage
      - ${CONFIG_LOCATION:-./data/localmind/config}:/root/.affine/config
      - ${ENTERPRISE_CLI_DATA_LOCATION:-./data/localmind/enterprise-cli}:/var/lib/localmind/enterprise-cli
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME:-affine}:${DB_PASSWORD:-affine}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false
      - LOCALMIND_ENTERPRISE_CLI_ROOT_DIR=/var/lib/localmind/enterprise-cli
      - ISCP_ENABLED=${ISCP_ENABLED:-false}
      - ISCP_CONTROLLER_URL=http://iscp_controller:8091
      - ISCP_CONTROLLER_TOKEN=${ISCP_CONTROLLER_TOKEN:-}
      - ISCP_DOMAIN_ID=${ISCP_DOMAIN_ID:-localmind}
    restart: unless-stopped

  sparkclaw_adapter:
    image: ${LOCALMIND_AFFINE_IMAGE:-localmind-affine:local}
    container_name: localmind_sparkclaw_adapter
    entrypoint: ['node']
    command: ['/app/sparkclaw-adapter.mjs']
    volumes:
      - ./sparkclaw-adapter.mjs:/app/sparkclaw-adapter.mjs:ro
    environment:
      - SPARKCLAW_ADAPTER_PORT=3100
      - SPARKCLAW_EMBEDDING_ORIGIN=${SPARKCLAW_EMBEDDING_ORIGIN:-http://192.168.20.207:8001}
      - SPARKCLAW_RERANK_ORIGIN=${SPARKCLAW_RERANK_ORIGIN:-http://192.168.20.207:8002}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  iscp_controller:
    profiles:
      - iscp
    image: ${LOCALMIND_ISCP_IMAGE:-localmind-iscp:local}
    build:
      context: ../..
      dockerfile: services/iscp-controller/Dockerfile
      target: controller
    container_name: localmind_iscp_controller
    ports:
      - '127.0.0.1:${ISCP_CONTROLLER_PORT:-8091}:8091'
    environment:
      - ISCP_DATABASE_URL=postgresql://${DB_USERNAME:-affine}:${DB_PASSWORD:-affine}@postgres:5432/${DB_DATABASE:-affine}
      - ISCP_CONTROLLER_TOKEN=${ISCP_CONTROLLER_TOKEN:-}
      - ISCP_DOMAIN_ID=${ISCP_DOMAIN_ID:-localmind}
      - ISCP_RELAY_ID=${ISCP_RELAY_ID:-localmind-relay}
      - ISCP_RELAY_INTERNAL_BASE_URL=http://iscp_relay:8080
      - ISCP_RELAY_INTERNAL_WS_URL=ws://iscp_relay:8080/v2/relay/connect
      - ISCP_RELAY_PUBLIC_BASE_URL=${ISCP_RELAY_PUBLIC_BASE_URL:-}
      - ISCP_RELAY_PUBLIC_WS_URL=${ISCP_RELAY_PUBLIC_WS_URL:-}
      - ISCP_STATE_DIR=/var/lib/localmind-iscp
    volumes:
      - iscp_state:/var/lib/localmind-iscp
    depends_on:
      postgres:
        condition: service_healthy
      iscp_relay:
        condition: service_started
    healthcheck:
      test: ['CMD', '/usr/local/bin/iscp-controller', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  iscp_relay:
    profiles:
      - iscp
    image: ${LOCALMIND_ISCP_IMAGE:-localmind-iscp:local}
    build:
      context: ../..
      dockerfile: services/iscp-controller/Dockerfile
      target: relay
    container_name: localmind_iscp_relay
    ports:
      - '127.0.0.1:${ISCP_RELAY_PORT:-8080}:8080'
    environment:
      - ISCP_PROFILE=production
      - ISCP_DATABASE_URL=postgresql://${DB_USERNAME:-affine}:${DB_PASSWORD:-affine}@postgres:5432/${DB_DATABASE:-affine}
      - ISCP_DOMAIN_ID=${ISCP_DOMAIN_ID:-localmind}
      - ISCP_RELAY_ID=${ISCP_RELAY_ID:-localmind-relay}
      - ISCP_RELAY_BASE_URL=${ISCP_RELAY_PUBLIC_BASE_URL:-}
      - ISCP_RELAY_WS_URL=${ISCP_RELAY_PUBLIC_WS_URL:-}
      - ISCP_ALLOWED_ORIGINS=${ISCP_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  affine_migration:
    image: ${LOCALMIND_AFFINE_IMAGE:-localmind-affine:local}
    build:
      context: ../..
      dockerfile: Dockerfile.localmind
    container_name: localmind_affine_migration_job
    volumes:
      - ${UPLOAD_LOCATION:-./data/localmind/storage}:/root/.affine/storage
      - ${CONFIG_LOCATION:-./data/localmind/config}:/root/.affine/config
      - ${ENTERPRISE_CLI_DATA_LOCATION:-./data/localmind/enterprise-cli}:/var/lib/localmind/enterprise-cli
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME:-affine}:${DB_PASSWORD:-affine}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false
      - LOCALMIND_ENTERPRISE_CLI_ROOT_DIR=/var/lib/localmind/enterprise-cli
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  affine_test:
    image: ${LOCALMIND_AFFINE_TEST_IMAGE:-localmind-affine:test}
    build:
      context: ../..
      dockerfile: Dockerfile.localmind
      target: test
    profiles:
      - test
    container_name: localmind_affine_test_runner
    depends_on:
      test_redis:
        condition: service_healthy
      test_postgres:
        condition: service_healthy
    environment:
      - REDIS_SERVER_HOST=test_redis
      - DATABASE_URL=postgresql://affine:affine@test_postgres:5432/affine_test
      - AFFINE_INDEXER_ENABLED=false
      - CI=1
    command:
      [
        'sh',
        '-lc',
        'yarn workspace @affine/server prisma migrate deploy && NODE_OPTIONS="--import=file:///workspace/tools/cli/register.js" yarn workspace @affine/server test src/__tests__/copilot/provider-registry.spec.ts src/__tests__/copilot/provider-middleware.spec.ts src/__tests__/copilot/provider-native.spec.ts src/__tests__/copilot/prompt-service.spec.ts src/__tests__/copilot/copilot.spec.ts src/__tests__/copilot/host-services.spec.ts && yarn vitest --run packages/frontend/core/src/modules/ai-button/services/models.spec.ts',
      ]

  redis:
    image: redis
    container_name: localmind_affine_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  test_redis:
    image: redis
    profiles:
      - test
    container_name: localmind_affine_test_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  test_postgres:
    image: pgvector/pgvector:pg16
    profiles:
      - test
    container_name: localmind_affine_test_postgres
    volumes:
      - ./data/localmind-test/postgres/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: affine
      POSTGRES_DB: affine_test
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine_test']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: localmind_affine_postgres
    volumes:
      - ${DB_DATA_LOCATION:-./data/localmind/postgres/pgdata}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME:-affine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-affine}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-U',
          '${DB_USERNAME:-affine}',
          '-d',
          '${DB_DATABASE:-affine}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  iscp_state:
