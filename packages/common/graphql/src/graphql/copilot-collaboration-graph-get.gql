query copilotCollaborationGraphGet {
  currentUser {
    copilot {
      myCollaborationGraph {
        nodes {
          id
          label
          self
          avatarUrl
        }
        edges {
          id
          kind
          from
          to
          status
          label
          requirementTitles
          requirementItems {
            id
            title
            kind
          }
          ownConversationExists
          sourceKind
          updatedAt
          expiresAt
          project {
            id
            name
          }
          ownNavigationKind
          ownSessionId
          ownWorkOrderId
          ownProjectId
          ownWorkspaceId
          ownDocId
        }
        truncated
      }
    }
  }
}
