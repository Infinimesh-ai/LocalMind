query copilotWorkOrderGet($workOrderId: ID!) {
  currentUser {
    copilot {
      myWorkOrder(workOrderId: $workOrderId) {
        id
        sourceSessionId
        sourceProjectNameSnapshot
        ownSessionId
        sourceContextVersion
        viewerRole
        title
        purpose
        relationKind
        status
        version
        templateVersion
        requirements {
          id
          itemKey
          kind
          title
          instructions
          required
          acceptedMimeTypes
          minCount
          maxCount
          validationMode
        }
        exchanges {
          id
          kind
          body
          createdAt
        }
        deliveries {
          id
          revision
          receiptFingerprint
          submittedAt
          items {
            requirementId
            blobId
            textValue
            fileName
            mimeType
            byteSize
          }
        }
        stagedBlobs {
          id
          requirementId
          fileName
          mimeType
          byteSize
          fingerprint
          createdAt
        }
        deliveryDraft {
          workOrderId
          orderVersion
          version
          updatedAt
          ready
          confirmationToken
          items {
            requirementId
            blobIds
            text
          }
          checks {
            requirementId
            ready
            reason
          }
        }
        deliveriesReleased
        createdAt
        updatedAt
      }
    }
  }
}
