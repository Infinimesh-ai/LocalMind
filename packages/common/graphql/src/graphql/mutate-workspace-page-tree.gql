mutation mutateWorkspacePageTree($input: WorkspacePageTreeCommandInput!) {
  mutateWorkspacePageTree(input: $input) {
    operationId
    nodeId
    resourceId
    parentNodeId
    revision
    oldParentNodeId
    oldSiblingOrder
    oldTargetSiblingOrder
    oldSourceSiblingOrder
    oldBeforeNodeId
  }
}
