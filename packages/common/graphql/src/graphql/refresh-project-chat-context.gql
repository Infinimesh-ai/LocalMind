mutation refreshProjectChatContext(
  $projectId: String!
  $sessionId: String!
  $expectedVersion: Int!
) {
  refreshProjectChatContext(
    projectId: $projectId
    sessionId: $sessionId
    expectedVersion: $expectedVersion
  ) {
    ...ProjectChatContextFields
  }
}

