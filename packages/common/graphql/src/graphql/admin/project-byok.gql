#import '../fragments/project-byok-settings.gql'

query adminProjectByokSettings {
  adminProjectByokSettings {
    ...ProjectByokSettings
  }
}

mutation saveProjectByokConfig($input: ProjectByokConfigInput!) {
  saveProjectByokConfig(input: $input) {
    ...ProjectByokSettings
  }
}

mutation setProjectByokEnabled($expectedRevision: SafeInt!, $enabled: Boolean!) {
  setProjectByokEnabled(expectedRevision: $expectedRevision, enabled: $enabled) {
    ...ProjectByokSettings
  }
}

mutation setWorkOrderByokEnabled(
  $expectedRevision: SafeInt!
  $enabled: Boolean!
) {
  setWorkOrderByokEnabled(
    expectedRevision: $expectedRevision
    enabled: $enabled
  ) {
    ...ProjectByokSettings
  }
}
