mutation requestCopilotAgentRuntimeOfficeCommand(
  $input: CopilotAgentRuntimeOfficeCommandRequestInput!
) {
  requestCopilotAgentRuntimeOfficeCommand(input: $input) {
    id
    workspaceId
    actorId
    workflow
    sourceType
    sourceId
    status
    title
    targetFingerprint
    evidenceFingerprint
    timelineFingerprint
    workerAttempt
    workerMaxAttempts
    createdAt
    updatedAt
    steps {
      id
      stepKey
      stepType
      status
      title
      order
      evidenceFingerprint
      outputSummary
    }
  }
}
