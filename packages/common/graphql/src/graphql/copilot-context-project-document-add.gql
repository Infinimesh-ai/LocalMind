mutation copilotContextProjectDocumentAdd(
  $input: AddCopilotContextProjectDocumentInput!
) {
  addCopilotContextProjectDocument(input: $input) {
    outcome
    projectDocument {
      workspaceId
      docId
      title
      groupId
      sortOrder
      status
      requestedLevel
      accessRequestId
      addedByMe
      createdAt
      updatedAt
    }
  }
}
