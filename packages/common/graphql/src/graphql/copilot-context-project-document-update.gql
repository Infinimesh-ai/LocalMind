mutation copilotContextProjectDocumentUpdate(
  $input: UpdateCopilotContextProjectDocumentInput!
) {
  updateCopilotContextProjectDocument(input: $input) {
    id
    role
    documents {
      workspaceId
      docId
      title
      groupId
      sortOrder
      status
      requestedLevel
      accessRequestId
      addedByMe
      createdAt
      updatedAt
    }
    documentCount
    canManage
    updatedAt
  }
}
