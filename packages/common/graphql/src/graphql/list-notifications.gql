query listNotifications(
  $pagination: PaginationInput!
  $includeRead: Boolean = false
) {
  currentUser {
    notifications(pagination: $pagination, includeRead: $includeRead) {
      totalCount
      edges {
        cursor
        node {
          id
          type
          level
          read
          createdAt
          updatedAt
          body
        }
      }
      pageInfo {
        startCursor
        endCursor
        hasNextPage
        hasPreviousPage
      }
    }
  }
}
