mutation revokeCopilotProjectGrant($input: RevokeCopilotProjectGrantInput!) {
  revokeCopilotProjectGrant(input: $input) {
    grant {
      id
      projectId
      projectName
      workspaceId
      docId
      level
      status
      source
      approvingSide
      revocable
      grantedByUserId
      accessRequestId
      grantedAt
      revokedByUserId
      revokedAt
      createdAt
      updatedAt
    }
    rerequestCardId
    quarantinedMemoryCount
  }
}
