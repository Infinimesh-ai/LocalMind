query copilotWorkOrderChatGet($workOrderId: ID!) {
  currentUser {
    copilot {
      myWorkOrderChat(workOrderId: $workOrderId) {
        sessionId
        workspaceId
        docId
        selectedContextProjectId
        parentSessionId
        promptName
        model
        optionalModels
        action
        pinned
        title
        tokens
        createdAt
        updatedAt
        messages {
          id
          role
          content
          attachments
          streamObjects {
            type
            textDelta
            toolCallId
            toolName
            args
            result
          }
          createdAt
        }
      }
      myWorkOrderAiModel(workOrderId: $workOrderId) {
        configured
        modelId
        provider
      }
    }
  }
}
