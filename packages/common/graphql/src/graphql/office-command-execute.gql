mutation executeOfficeCommand($input: OfficeCommandInput!) {
  executeOfficeCommand(input: $input) {
    created
    artifact {
      id
      workspaceId
      kind
      title
      sourceFileName
      sourceMimeType
      sourceByteSize
      sourceFingerprint
      revisionCounter
      compatibility
      createdBy
      createdAt
      updatedAt
      currentRevision {
        id
        workspaceId
        artifactId
        sequence
        origin
        parentRevisionId
        packageMimeType
        packageByteSize
        packageFingerprint
        stateByteSize
        stateFingerprint
        modelVersion
        operationSummary
        createdBy
        createdAt
        packageUrl
        stateUrl
      }
    }
    revision {
      id
      workspaceId
      artifactId
      sequence
      origin
      parentRevisionId
      packageMimeType
      packageByteSize
      packageFingerprint
      stateByteSize
      stateFingerprint
      modelVersion
      operationSummary
      createdBy
      createdAt
      packageUrl
      stateUrl
    }
    summary
  }
}
