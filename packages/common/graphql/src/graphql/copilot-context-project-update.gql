mutation copilotContextProjectUpdate(
  $input: UpdateCopilotContextProjectInput!
) {
  updateCopilotContextProject(input: $input) {
    id
    createdByUserId
    name
    description
    status
    aiPolicy
    role
    members {
      userId
      name
      email
      avatarUrl
      role
      createdAt
    }
    documents {
      workspaceId
      docId
      title
      groupId
      sortOrder
      status
      requestedLevel
      accessRequestId
      addedByMe
      createdAt
      updatedAt
    }
    documentCount
    canManage
    createdAt
    updatedAt
  }
}
