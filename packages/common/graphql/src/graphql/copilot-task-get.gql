query copilotTaskGet($workspaceId: String!, $taskId: String!) {
  currentUser {
    copilot(workspaceId: $workspaceId) {
      copilotTask(id: $taskId) {
        id
        workspaceId
        projectId
        title
        workflow
        status
        createdAt
        updatedAt
        startedAt
        completedAt
        failureCode
        failureMessage
        resultSummary
        approvalSummary
        resultEvidence
        availableActions
        abandoned
        approval {
          stepId
          status
          title
          decidedAt
        }
        artifacts {
          kind
          id
          title
        }
        steps {
          id
          key
          type
          status
          title
          order
          startedAt
          completedAt
        }
      }
    }
  }
}
