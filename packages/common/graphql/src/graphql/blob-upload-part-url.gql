query getBlobUploadPartUrl(
  $workspaceId: String!
  $key: String!
  $uploadId: String!
  $partNumber: Int!
  $docScopeId: String
) {
  workspace(id: $workspaceId) {
    blobUploadPartUrl(
      key: $key
      uploadId: $uploadId
      partNumber: $partNumber
      docScopeId: $docScopeId
    ) {
      uploadUrl
      headers
      expiresAt
    }
  }
}
