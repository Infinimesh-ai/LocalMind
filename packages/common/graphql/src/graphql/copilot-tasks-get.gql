query copilotTasksGet(
  $workspaceId: String
  $limit: SafeInt
  $filter: CopilotTaskListFilterInput
) {
  currentUser {
    copilot(workspaceId: $workspaceId) {
      copilotTasks(filter: $filter, limit: $limit) {
        id
        workspaceId
        projectId
        title
        workflow
        status
        createdAt
        updatedAt
        startedAt
        completedAt
        failureCode
        failureMessage
        resultSummary
        approvalSummary
        resultEvidence
        availableActions
        abandoned
        approval {
          stepId
          status
          title
          decidedAt
        }
        artifacts {
          kind
          id
          title
        }
        steps {
          id
          key
          type
          status
          title
          order
          startedAt
          completedAt
        }
      }
    }
  }
}
